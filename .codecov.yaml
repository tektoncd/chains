coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default: false

ignore:
  # Auto-generated deepcopy code.
  - "**/zz_generated*.go"
  - "**/fake/**"
  # Entry-point binaries.
  - "cmd"
  - "vendor"
  - "test"
  - "pkg/test/"
  - "config"
  - "docs"
  - "hack"
  - "examples"
  - "images"
  - "release"
