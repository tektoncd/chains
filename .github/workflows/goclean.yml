name: goclean

permissions:
  contents: read

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
    branches:
      - main
      - release-*
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
    branches:
      - main
      - release-*
  schedule:
    - cron: '41 20 * * 1'

jobs:
  goclean:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
      with:
        go-version-file: "go.mod"
        cache: false

    - name: go vet
      run: |
        # Use in-place vendored dependencies.
        go vet -mod=vendor ./...

    # If this workflow fails, run `go fmt` on your tree and resubmit.
    # We ignore vendor/ files whose format we don't control.
    - name: go fmt
      run: if [ "$(gofmt -l . | grep -v vendor/ | grep -v third_party/ | wc -l)" -gt 0 ]; then exit 1; fi
